name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Everything runs on the recorded NHTSA replies in fixtures/nhtsa/. No secrets, no model calls, no AWS:
  # the Anthropic adapter is tested with a fake SDK and the Lambda bundle with a stubbed runtime.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Node 24 majors (v4 targeted Node 20, deprecated on GitHub's runners). CI never pushes, so the
      # token is not left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-11-14
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, resolved 2026-11-14
        with:
          node-version: "22"
          cache: npm

      # The root package.json lists web/ as an npm workspace, so one install covers the page too.
      - name: Install
        run: npm ci

      - name: Unit tests (node --test)
        run: npm test

      - name: Build the page
        run: npm run web:build

      - name: Build the Lambda bundle
        run: npm run build:lambda
